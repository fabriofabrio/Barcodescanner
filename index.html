<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lettore Android Definitivo</title>
    <!-- Libreria Html5-Qrcode aggiornata -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            color: #2f3640;
            margin: 0 0 15px 0;
            font-size: 20px;
        }
        #interactive-camera {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        /* Correzione per mostrare correttamente lo specchio della telecamera */
        #interactive-camera video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }
        .status-box {
            font-size: 14px;
            color: #e67e22;
            margin-bottom: 15px;
            font-weight: bold;
            padding: 8px;
            background: #fdf2e9;
            border-radius: 6px;
            word-break: break-all;
        }
        textarea {
            width: 100%;
            height: 140px;
            padding: 10px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            resize: none;
            background-color: #f8f9fa;
            margin-bottom: 15px;
        }
        .btn {
            background-color: #4cd137;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(76, 209, 55, 0.3);
        }
        .btn:active {
            background-color: #44bd32;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Lettore Codici Android</h1>
    
    <div id="interactive-camera"></div>
    
    <div id="status" class="status-box">Richiesta accesso fotocamera...</div>
    
    <textarea id="barcode-list" readonly placeholder="I codici scansionati appariranno qui di seguito..."></textarea>
    
    <button class="btn" id="download-btn">Scarica File TXT</button>
</div>

<script>
    const barcodeList = document.getElementById('barcode-list');
    const downloadBtn = document.getElementById('download-btn');
    const statusDiv = document.getElementById('status');
    
    let lastScannedCode = "";
    let lastScannedTime = 0;
    let html5QrCode;

    function onScanSuccess(decodedText, decodedResult) {
        const currentTime = Date.now();
        if (decodedText === lastScannedCode && (currentTime - lastScannedTime < 2000)) {
            return; 
        }

        lastScannedCode = decodedText;
        lastScannedTime = currentTime;

        statusDiv.innerText = `Letto: ${decodedText}`;
        statusDiv.style.color = "#27ae60";
        statusDiv.style.backgroundColor = "#e8f5e9";

        if (barcodeList.value === '') {
            barcodeList.value = decodedText;
        } else {
            barcodeList.value += '\n' + decodedText;
        }

        barcodeList.scrollTop = barcodeList.scrollHeight;

        if (navigator.vibrate) {
            navigator.vibrate(100);
        }
    }

    // Inizializzazione avanzata e forzata per i dispositivi mobili
    function avviaLettore() {
        html5QrCode = new Html5Qrcode("interactive-camera");
        
        // Configurazione flessibile per i sensori fotografici Android
        const config = { 
            fps: 15,
            qrbox: (width, height) => {
                const size = Math.min(width, height) * 0.75;
                return { width: size, height: size * 0.6 };
            }
        };

        // Chiede esplicitamente la fotocamera posteriore (environment)
        html5QrCode.start(
            { facingMode: "environment" }, 
            config, 
            onScanSuccess
        ).then(() => {
            statusDiv.innerText = "Inquadra un codice a barre o un QR Code";
            statusDiv.style.color = "#2e86de";
            statusDiv.style.backgroundColor = "#ebf5fb";
        }).catch((err) => {
            statusDiv.innerText = "Errore di avvio. Controlla le autorizzazioni della fotocamera.";
            statusDiv.style.color = "#c0392b";
            statusDiv.style.backgroundColor = "#f9ebea";
            console.error(err);
        });
    }

    // Avvia lo script solo dopo il caricamento completo della pagina
    window.addEventListener('DOMContentLoaded', () => {
        // Breve ritardo per garantire che l'hardware sia pronto
        setTimeout(avviaLettore, 500);
    });

    downloadBtn.addEventListener('click', () => {
        const textToSave = barcodeList.value;
        if (textToSave.trim() === '') {
            alert('Nessun codice in lista da salvare!');
            return;
        }
        const blob = new Blob([textToSave], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'codici_android.txt';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    });
</script>

</body>
</html>
