<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lettore POCO X3 Antiduplicato</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 { color: #2f3640; margin: 0 0 15px 0; font-size: 20px; }
        .video-wrapper {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        #webcam { width: 100%; height: 100%; object-fit: cover; }
        .status-box { font-size: 14px; color: #e67e22; margin-bottom: 15px; font-weight: bold; padding: 8px; background: #fdf2e9; border-radius: 6px; }
        textarea { width: 100%; height: 140px; padding: 10px; border: 1px solid #dcdde1; border-radius: 6px; font-family: monospace; font-size: 14px; resize: none; background-color: #f8f9fa; margin-bottom: 15px; }
        .btn { color: white; border: none; padding: 14px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; background-color: #2ecc71; box-shadow: 0 2px 5px rgba(46, 204, 113, 0.3); }
        .btn:active { background-color: #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <h1>Lettore Codici Android</h1>
    <div class="video-wrapper">
        <video id="webcam" autoplay playsinline muted></video>
    </div>
    <div id="status" class="status-box">Inizializzazione fotocamera...</div>
    <textarea id="barcode-list" readonly placeholder="I codici scansionati appariranno qui..."></textarea>
    <button class="btn" id="download-btn">Scarica File TXT</button>
</div>

<script>
    const video = document.getElementById('webcam');
    const barcodeList = document.getElementById('barcode-list');
    const downloadBtn = document.getElementById('download-btn');
    const statusDiv = document.getElementById('status');
    
    let lastScannedCode = "";
    let lastScannedTime = 0;
    let detector;

    if ('BarcodeDetector' in window) {
        detector = new BarcodeDetector({
            formats: ['ean_13', 'ean_8', 'code_128', 'code_39', 'qr_code', 'upc_a']
        });
    } else {
        statusDiv.innerText = "Errore: Aggiorna l'app Google Chrome sul tuo POCO.";
    }

    async function avviaFotocameraNativa() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { 
                    facingMode: "environment",
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: false
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                statusDiv.innerText = "Inquadra un codice a barre o un QR";
                statusDiv.style.color = "#2e86de";
                statusDiv.style.backgroundColor = "#ebf5fb";
                analizzaFotogrammi();
            };
        } catch (err) {
            statusDiv.innerText = "Fotocamera bloccata. Chiudi altre app aperte.";
            statusDiv.style.color = "#c0392b";
            statusDiv.style.backgroundColor = "#f9ebea";
        }
    }

    function analizzaFotogrammi() {
        async function loop() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && detector) {
                try {
                    const barcodes = await detector.detect(video);
                    if (barcodes && barcodes.length > 0) {
                        // Estrae la stringa del codice rilevato dal motore nativo di Chrome
                        const codiceRilevato = barcodes[0].rawValue;
                        gestisciCodiceLetto(codiceRilevato);
                    }
                } catch (e) {
                    console.error(e);
                }
            }
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    }

    function gestisciCodiceLetto(decodedText) {
        if (!decodedText) return;
        const currentTime = Date.now();
        
        // NUOVA LOGICA: Se il codice è lo stesso di prima, bloccalo per 6 secondi (6000 millisecondi)
        // Se invece il codice è diverso, lo memorizza all'istante bypassando l'attesa
        if (decodedText === lastScannedCode && (currentTime - lastScannedTime < 6000)) {
            return; 
        }

        lastScannedCode = decodedText;
        lastScannedTime = currentTime;

        statusDiv.innerText = `Letto: ${decodedText}`;
        statusDiv.style.color = "#27ae60";
        statusDiv.style.backgroundColor = "#e8f5e9";

        if (barcodeList.value === '') {
            barcodeList.value = decodedText;
        } else {
            barcodeList.value += '\n' + decodedText;
        }
        barcodeList.scrollTop = barcodeList.scrollHeight;

        if (navigator.vibrate) {
            navigator.vibrate(100);
        }
    }

    window.addEventListener('DOMContentLoaded', avviaFotocameraNativa);

    downloadBtn.addEventListener('click', () => {
        const textToSave = barcodeList.value;
        if (textToSave.trim() === '') {
            alert('Nessun codice salvato nella lista!');
            return;
        }
        const blob = new Blob([textToSave], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'codici_letti.txt';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    });
</script>

</body>
</html>
