<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lettore Android</title>
    <!-- Inclusione della libreria per la scansione da fotocamera -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            color: #2f3640;
            margin: 0 0 15px 0;
            font-size: 20px;
        }
        #interactive-camera {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            position: relative;
        }
        .status-box {
            font-size: 14px;
            color: #e67e22;
            margin-bottom: 15px;
            font-weight: bold;
            padding: 8px;
            background: #fdf2e9;
            border-radius: 6px;
            word-break: break-all;
        }
        textarea {
            width: 100%;
            height: 140px;
            padding: 10px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            resize: none;
            background-color: #f8f9fa;
            margin-bottom: 15px;
        }
        .btn {
            background-color: #4cd137;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(76, 209, 55, 0.3);
        }
        .btn:active {
            background-color: #44bd32;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Lettore Codici Android</h1>
    
    <!-- Area video per la fotocamera posteriore -->
    <div id="interactive-camera"></div>
    
    <div id="status" class="status-box">Inizializzazione fotocamera...</div>
    
    <!-- Lista codici concatenati -->
    <textarea id="barcode-list" readonly placeholder="I codici scansionati appariranno qui di seguito..."></textarea>
    
    <!-- Pulsante di download file .txt -->
    <button class="btn" id="download-btn">Scarica File TXT</button>
</div>

<script>
    const barcodeList = document.getElementById('barcode-list');
    const downloadBtn = document.getElementById('download-btn');
    const statusDiv = document.getElementById('status');
    
    let lastScannedCode = "";
    let lastScannedTime = 0;

    // Crea l'istanza del lettore agganciandola al div della fotocamera
    const html5QrCode = new Html5Qrcode("interactive-camera");

    // Configurazione ottimizzata per Android
    const config = { 
        fps: 15, 
        qrbox: function(viewfinderWidth, viewfinderHeight) {
            // Rende il rettangolo di mira proporzionato allo schermo dello smartphone
            const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
            const boxSize = Math.floor(minEdge * 0.7);
            return { width: boxSize, height: Math.floor(boxSize * 0.6) };
        }
    };

    // Callback in caso di successo nella lettura
    function onScanSuccess(decodedText, decodedResult) {
        const currentTime = Date.now();
        
        // Evita letture duplicate dello stesso codice prima che siano passati 2 secondi
        if (decodedText === lastScannedCode && (currentTime - lastScannedTime < 2000)) {
            return; 
        }

        lastScannedCode = decodedText;
        lastScannedTime = currentTime;

        // Mostra a schermo l'ultimo codice letto
        statusDiv.innerText = `Letto: ${decodedText}`;
        statusDiv.style.color = "#27ae60";
        statusDiv.style.backgroundColor = "#e8f5e9";

        // Concatena il testo nella lista andando a capo
        if (barcodeList.value === '') {
            barcodeList.value = decodedText;
        } else {
            barcodeList.value += '\n' + decodedText;
        }

        // Porta lo scorrimento del testo sempre alla fine
        barcodeList.scrollTop = barcodeList.scrollHeight;

        // Breve vibrazione dello smartphone per confermare la lettura (se supportata da Android)
        if (navigator.vibrate) {
            navigator.vibrate(100);
        }
    }

    // Avvia la fotocamera posteriore (environment) in modo automatico
    html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess
    ).then(() => {
        statusDiv.innerText = "Inquadra un codice a barre o un QR Code";
        statusDiv.style.color = "#2e86de";
        statusDiv.style.backgroundColor = "#ebf5fb";
    }).catch((err) => {
        statusDiv.innerText = "Errore: Attiva i permessi della fotocamera o usa HTTPS.";
        statusDiv.style.color = "#c0392b";
        statusDiv.style.backgroundColor = "#f9ebea";
        console.error(err);
    });

    // Gestione del salvataggio del file su memoria Android
    downloadBtn.addEventListener('click', () => {
        const textToSave = barcodeList.value;
        
        if (textToSave.trim() === '') {
            alert('Nessun codice in lista da salvare!');
            return;
        }
        
        const blob = new Blob([textToSave], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        
        link.href = url;
        link.download = 'codici_android.txt';
        document.body.appendChild(link);
        link.click();
        
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    });
</script>

</body>
</html>
